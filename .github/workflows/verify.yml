name: verify finite-field tensor identities

on:
  push:
    branches:
      - main
      - research/**
  pull_request:
    branches:
      - main

jobs:
  polynomial-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic verifier
        run: python -m pip install 'sympy>=1.12,<2'
      - name: Check coefficient identities
        run: python tests/split_cayley_tensor_certificate.py
