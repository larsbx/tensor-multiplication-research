name: verify finite-field tensor identities

on:
  push:
    branches:
      - main
      - research/**
  pull_request:
    branches:
      - main

jobs:
  polynomial-certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install symbolic verifier
        run: python -m pip install 'sympy>=1.12,<2'
      - name: Check coefficient identities
        run: python tests/split_cayley_tensor_certificate.py

      - name: Exact training-route prototype tests
        run: python -m unittest discover -s tests -p 'test_training_route_audit.py' -v
      - name: Exact F5 Coxeter boundary and effect controls\n        run: python -m unittest discover -s tests -p 'test_rt_coxeter_reference.py' -v\n      - name: Print reproducible route-audit records
        run: python experiments/training_route_audit.py > /tmp/training-route-audit.json
